name: ci

# The ROM-free test run. CI has no cartridge and never will: no ROM bytes and
# nothing derived from them is committed. The suite runs against the fixtures in
# tests/, so it needs no ROM, no display and no imported cache.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  tests:
    name: editor scan and GUT
    runs-on: ubuntu-latest
    # The whole job is about four minutes. This is the backstop behind
    # `tools/ci_godot.sh`, which caps each Godot run itself: nothing should ever
    # reach this number, and a job that does is stuck somewhere else.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A workflow that names an action version which does not exist fails at
      # "Set up job", and release.yml only runs on a tag, so without this the
      # first place anyone learns of it is a release that never built.
      - name: Every action version resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          for ref in $(grep -rhoE 'actions/[a-z-]+@v[0-9.]+' .github/workflows/ \
                        | sort -u); do
            if gh api "repos/${ref%@*}/git/ref/tags/${ref#*@}" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "::error::$ref does not resolve"
              missing=1
            fi
          done
          exit $missing

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import and resolve class_name
        env:
          GODOT_CAP: 600
        run: |
          set -euo pipefail
          tools/ci_godot.sh ~/godot/godot --headless --editor --path . --quit
          [ -d .godot ] || { echo "::error::import produced no .godot"; exit 1; }

      # The one step whose verdict is in its own output. Godot's teardown races
      # with the threads a run leaves behind and has not always returned from it
      # on a Linux runner, twenty minutes after the suite said it passed; that
      # is now a warning with every thread's stack under it rather than a red
      # build, and a suite that fails or hangs before printing this line is
      # still red.
      - name: GUT
        env:
          GODOT_CAP: 900
          GODOT_DONE: "---- All tests passed! ----"
        run: |
          tools/ci_godot.sh ~/godot/godot --headless --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests -ginclude_subdirs -gexit

      - name: Boot smoke test
        env:
          GODOT_CAP: 180
        run: tools/ci_godot.sh ~/godot/godot --headless --path . --quit-after 30
