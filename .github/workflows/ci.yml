name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Bot-authored AltStore feed PRs cannot start this run; export-preset tests cover the feed.
    paths-ignore: [".github/altstore/source.json"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  tests:
    name: editor scan and GUT
    runs-on: ubuntu-latest
    # Job cap covers hangs outside `tools/ci_godot.sh`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Tag-triggered release workflows need action-version validation here.
      - name: Every action version resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          for ref in $(grep -rhoE 'actions/[a-z-]+@v[0-9.]+' .github/workflows/ \
                        | sort -u); do
            if gh api "repos/${ref%@*}/git/ref/tags/${ref#*@}" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "::error::$ref does not resolve"
              missing=1
            fi
          done
          exit $missing

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import and resolve class_name
        env:
          GODOT_CAP: 600
        run: |
          set -euo pipefail
          tools/ci_godot.sh ~/godot/godot --headless --editor --path . --quit
          [ -d .godot ] || { echo "::error::import produced no .godot"; exit 1; }

      # Linux audio teardown can hang after GUT prints its verdict.
      - name: GUT
        env:
          GODOT_CAP: 900
          GODOT_DONE: "---- All tests passed! ----"
        run: |
          tools/ci_godot.sh ~/godot/godot --headless --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests -ginclude_subdirs -gexit

      - name: Boot smoke test
        env:
          GODOT_CAP: 180
        run: tools/ci_godot.sh ~/godot/godot --headless --path . --quit-after 30
