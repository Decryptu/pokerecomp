name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Bot-authored AltStore feed PRs cannot start this run; export-preset tests cover the feed.
    paths-ignore: [".github/altstore/source.json"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.8-dev7

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lightweight release and writing gates
        run: tools/release.sh --gates

      - name: Workflow regression checks
        run: python3 -m unittest discover -s tests -p 'test_workflow.py'

      - name: Select affected tests
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 tools/test.py --base "$BASE" --list > /tmp/test-selection
          else
            python3 tools/test.py --full --list > /tmp/test-selection
          fi
          cat /tmp/test-selection
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          count = int(Path('/tmp/test-selection').read_text().split()[0])
          workers = min(4, max(1, (count + 24) // 25))
          print('matrix=' + json.dumps({'shard': [f'{i+1}/{workers}' for i in range(workers)]}))
          PYTHON

      # Tag-triggered release workflows need action-version validation here.
      - name: Every action version resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          for ref in $(grep -rhoE 'actions/[a-z-]+@v[0-9.]+' .github/workflows/ \
                        | sort -u); do
            if gh api "repos/${ref%@*}/git/ref/tags/${ref#*@}" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "::error::$ref does not resolve"
              missing=1
            fi
          done
          exit $missing

  gut:
    name: GUT ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select this worker's tests
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$BASE" ]; then
            python3 tools/test.py --base "$BASE" --shard "$SHARD" --list > /tmp/test-selection
          else
            python3 tools/test.py --full --shard "$SHARD" --list > /tmp/test-selection
          fi
          cat /tmp/test-selection
          if head -1 /tmp/test-selection | grep -q '^0 test scripts:'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Godot binary
        if: steps.selection.outputs.run == 'true'
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.selection.outputs.run == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import and GUT
        if: steps.selection.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          export GODOT_BIN="$HOME/godot/godot"
          if [ -n "$BASE" ]; then
            python3 tools/test.py --import --base "$BASE" --shard "$SHARD"
          else
            python3 tools/test.py --import --full --shard "$SHARD"
          fi

      - name: Boot smoke test
        if: steps.selection.outputs.run == 'true' && startsWith(matrix.shard, '1/')
        env:
          GODOT_CAP: 30
        run: tools/ci_godot.sh ~/godot/godot --headless --path . --quit-after 30

  tests:
    name: editor scan and GUT
    needs: [plan, gut]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every selected worker
        env:
          PLAN: ${{ needs.plan.result }}
          GUT: ${{ needs.gut.result }}
        run: test "$PLAN" = success && test "$GUT" = success
