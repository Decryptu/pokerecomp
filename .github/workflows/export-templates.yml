name: export templates


on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build from"
        required: true
        type: string
  pull_request:
    paths:
      - tools/build_export_templates.sh
      - .github/workflows/export-templates.yml
  # Scheduled reads keep the costly template cache alive.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build from"
        required: false
        type: string

env:
  GODOT_VERSION: 4.8-dev4
  # This commit matches the stock 4.8.dev4 template build.
  GODOT_COMMIT: b56a91878e7c94977e4af978968e41d0670c0a8b
  # Switch needs a same-series Godot fork with `platform/nx`.
  GODOT_NX_REMOTE: https://github.com/Decryptu/godot.git
  GODOT_NX_COMMIT: e25f31c1248c0955994e865a80d94d32520a53b9

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runs-on: ubuntu-latest
            targets: linux-x86_64
          - host: linux-arm64
            runs-on: ubuntu-24.04-arm
            targets: linux-arm64
          - host: windows
            runs-on: windows-latest
            targets: windows-x86_64 windows-arm64
          - host: macos
            runs-on: macos-latest
            targets: macos
          - host: ios
            runs-on: macos-latest
            targets: ios
          - host: android
            runs-on: ubuntu-latest
            targets: android
          - host: switch
            runs-on: ubuntu-latest
            container: devkitpro/devkita64:latest
            targets: switch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Cache by engine pin and build flags.
      - id: cache
        uses: actions/cache@v6
        with:
          path: templates
          key: templates-${{ matrix.host }}-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/build_export_templates.sh') }}

      - uses: actions/setup-java@v6
        if: steps.cache.outputs.cache-hit != 'true' && matrix.host == 'android'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.host }}" = "switch" ]; then
            apt-get update
            apt-get install -y --no-install-recommends scons
            missing=""
            for lib in libEGL libGLESv2 libglapi libdrm_nouveau \
                       libz libpng16 libfreetype libbz2 libwebp \
                       libogg libvorbis libtheora libopusfile libvpx \
                       libminiupnpc libzstd libpcre2-32 libenet; do
              [ -f "/opt/devkitpro/portlibs/switch/lib/$lib.a" ] || missing="$missing $lib"
            done
            if [ -n "$missing" ]; then
              echo "::error::devkitpro/devkita64 no longer ships:$missing"
              exit 1
            fi
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y scons \
                libx11-dev libxcursor-dev libxinerama-dev libxi-dev \
                libxrandr-dev libwayland-dev libxkbcommon-dev libudev-dev \
                libasound2-dev libpulse-dev libgl1-mesa-dev
              ;;
            macOS)
              brew untap aws/tap 2>/dev/null || true
              brew install scons
              ;;
            Windows) python -m pip install --disable-pip-version-check scons ;;
          esac

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          remote="https://github.com/godotengine/godot.git"
          commit="$GODOT_COMMIT"
          if [ "${{ matrix.host }}" = "switch" ]; then
            remote="$GODOT_NX_REMOTE"
            commit="$GODOT_NX_COMMIT"
          fi
          git init -q godot-src
          git -C godot-src remote add origin "$remote"
          git -C godot-src fetch -q --depth 1 origin "$commit"
          git -C godot-src checkout -q FETCH_HEAD

          # Stock and custom templates must share a Godot series.
          pin=$(python3 -c "import runpy; v = runpy.run_path('godot-src/version.py'); print('%s.%s' % (v['major'], v['minor']))")
          if [ "$pin" != "${GODOT_VERSION%%-*}" ]; then
            echo "::error::the pinned commit is Godot $pin, the release installs stock $GODOT_VERSION templates"
            exit 1
          fi

          jobs=$(python3 -c 'import os; print(os.cpu_count())')
          SCONSFLAGS="-j$jobs" \
            tools/build_export_templates.sh godot-src templates ${{ matrix.targets }}

      - uses: actions/upload-artifact@v7
        with:
          name: templates-${{ matrix.host }}
          path: templates/*
          retention-days: 1
