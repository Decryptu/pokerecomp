name: export templates

# Builds the engine every published download is wrapped around.
#
# Stock export templates carry every renderer and every importable format,
# unstripped, and they are around nine tenths of a download's weight.
# `tools/build_export_templates.sh` builds the same pin without the parts
# nothing here can execute, and says which and why.
#
# `release.yml` calls this. It also runs on its own, because building the engine
# is the slow half of a release and a tag is a bad place to find out that a
# toolchain moved: dispatch it first, watch it go green, and the release that
# follows takes the cache.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build from"
        required: true
        type: string
  # The engine is rebuilt when the flag set moves, which is the one change that
  # can break a release without touching a line of the game.
  pull_request:
    paths:
      - tools/build_export_templates.sh
      - .github/workflows/export-templates.yml
  # A cache nothing reads for seven days is deleted, and a release would then
  # pay the whole build again without anything having changed. Restoring it is
  # what keeps it, so this runs weekly and finishes in seconds.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build from"
        required: false
        type: string

env:
  GODOT_VERSION: 4.8-dev3
  # A development snapshot is tagged nowhere in the engine repository, so the
  # pin is the commit the stock templates name themselves after:
  # `4.8.dev3.official.51105ccbe`. The build checks that it still agrees.
  GODOT_COMMIT: 51105ccbe58381774ecd7a7486d564b202a5192e
  # Nintendo ships no Godot platform and upstream carries none, so the Switch
  # template is built from a fork of the same pin that adds `platform/nx`.
  GODOT_NX_REMOTE: https://github.com/Decryptu/godot.git
  GODOT_NX_COMMIT: ada239b4354f12b38a23ab8f6c6b4fa22000485f

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runs-on: ubuntu-latest
            targets: linux-x86_64
          # A public repository gets Arm runners, so this is a native build
          # rather than a cross toolchain nobody can test.
          - host: linux-arm64
            runs-on: ubuntu-24.04-arm
            targets: linux-arm64
          - host: windows
            runs-on: windows-latest
            targets: windows-x86_64 windows-arm64
          - host: macos
            runs-on: macos-latest
            targets: macos
          - host: ios
            runs-on: macos-latest
            targets: ios
          - host: android
            runs-on: ubuntu-latest
            targets: android
          # devkitA64 and switch-mesa come from devkitPro's own image, which is
          # the only place they are packaged for CI.
          - host: switch
            runs-on: ubuntu-latest
            container: devkitpro/devkita64:latest
            targets: switch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Building the engine costs the better part of an hour and the result only
      # changes when the pin or the flag set does, so the key carries both.
      # v6, matching ci.yml: v4 runs on Node 20, which GitHub is removing from
      # its runners. v5 and v6 are runtime and packaging changes only, so the
      # caches v4 wrote still restore.
      - id: cache
        uses: actions/cache@v6
        with:
          path: templates
          key: templates-${{ matrix.host }}-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/build_export_templates.sh') }}

      - uses: actions/setup-java@v6
        if: steps.cache.outputs.cache-hit != 'true' && matrix.host == 'android'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.host }}" = "switch" ]; then
            # The devkitPro image carries devkitA64 and nothing else, and it is
            # root without sudo. switch-mesa is the GLES3 driver; the rest are
            # what detect.py links when the matching builtin_* is off.
            dkp-pacman -Sy --noconfirm --needed \
              switch-pkg-config switch-mesa switch-libdrm_nouveau \
              switch-zlib switch-libpng switch-freetype switch-bzip2 \
              switch-libwebp switch-libogg switch-libvorbis switch-libtheora \
              switch-opusfile switch-libopus switch-libvpx switch-miniupnpc \
              switch-zstd switch-pcre2 switch-libenet
            apt-get update
            apt-get install -y --no-install-recommends git python3 scons
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              # What a linuxbsd build links against. The Android target needs
              # none of it, but the package set is cheap next to the build.
              sudo apt-get install -y scons \
                libx11-dev libxcursor-dev libxinerama-dev libxi-dev \
                libxrandr-dev libwayland-dev libxkbcommon-dev libudev-dev \
                libasound2-dev libpulse-dev libgl1-mesa-dev
              ;;
            # The runner image ships an untrusted aws/tap, and Homebrew warns
            # about it on every install whatever is being installed. Dropping
            # the tap is the fix Homebrew itself names; nothing here wants it.
            macOS)
              brew untap aws/tap 2>/dev/null || true
              brew install scons
              ;;
            Windows) python -m pip install --disable-pip-version-check scons ;;
          esac

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          remote="https://github.com/godotengine/godot.git"
          commit="$GODOT_COMMIT"
          if [ "${{ matrix.host }}" = "switch" ]; then
            remote="$GODOT_NX_REMOTE"
            commit="$GODOT_NX_COMMIT"
          fi
          git init -q godot-src
          git -C godot-src remote add origin "$remote"
          git -C godot-src fetch -q --depth 1 origin "$commit"
          git -C godot-src checkout -q FETCH_HEAD

          # A pin that has drifted from the version the release installs stock
          # templates for would mix two engines in one download. Only the
          # series can be checked: a snapshot number is stamped by the engine's
          # own release process and is nowhere in the source.
          pin=$(python3 -c "import runpy; v = runpy.run_path('godot-src/version.py'); print('%s.%s' % (v['major'], v['minor']))")
          if [ "$pin" != "${GODOT_VERSION%%-*}" ]; then
            echo "::error::the pinned commit is Godot $pin, the release installs stock $GODOT_VERSION templates"
            exit 1
          fi

          jobs=$(python3 -c 'import os; print(os.cpu_count())')
          SCONSFLAGS="-j$jobs" \
            tools/build_export_templates.sh godot-src templates ${{ matrix.targets }}

      - uses: actions/upload-artifact@v7
        with:
          name: templates-${{ matrix.host }}
          path: templates/*
          retention-days: 1
