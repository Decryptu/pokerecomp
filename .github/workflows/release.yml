name: release

# Builds every published target from a tag and attaches them to a GitHub
# release. CI has no cartridge, so a build ships the importer and no game data;
# the player brings their own ROM the way a source checkout does.
#
# The version is not stamped here. `Gen2AppVersion.VERSION` is the one place it
# is written and `tests/unit/test_update_check.gd` holds the export presets to
# it, so this workflow only refuses a tag that disagrees.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.8-dev4
  GODOT_TEMPLATE_DIR: 4.8.dev4
  # The engine the iOS plugin compiles against. It must be the commit
  # `export-templates.yml` builds the templates from, since the plugin is linked
  # into them and the two have to agree about what a header declares.
  GODOT_COMMIT: b56a91878e7c94977e4af978968e41d0670c0a8b

jobs:
  version:
    name: agree on a version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag that disagrees with the source would publish builds the launcher's
      # update check then calls newer or older than themselves.
      - id: read
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared="$(sed -n 's/^const VERSION: String = "\(.*\)"$/\1/p' game/main/app_version.gd)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag says $version, game/main/app_version.gd says $declared"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  templates:
    needs: version
    uses: ./.github/workflows/export-templates.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  linux-windows-android:
    name: linux, windows and android
    needs: [version, templates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          echo "GODOT=/usr/local/bin/godot" >> "$GITHUB_ENV"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          # The directory is named by version.txt inside the archive, never by
          # the release tag: 4.8.dev4 rather than 4.8-dev4.
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -R /tmp/tpz/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      # Only the names built here are replaced, so nothing can lose a target:
      # a stock template stays until something takes its place.
      - uses: actions/download-artifact@v8
        with:
          pattern: templates-{linux-x86_64,linux-arm64,windows,android}
          path: /tmp/templates
          merge-multiple: true
      - name: Overlay the project's own export templates
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          before=$(du -sk "$dir" | cut -f1)
          cp -f /tmp/templates/* "$dir/"
          echo "template directory: ${before} kB -> $(du -sk "$dir" | cut -f1) kB"

      - name: Import
        run: |
          set -euo pipefail
          GODOT_CAP=900 tools/ci_godot.sh "$GODOT" --headless --editor --path . --quit
          [ -d .godot ] || { echo "::error::import produced no .godot"; exit 1; }

      # The Android preset builds through gradle, and Godot reads the SDK and
      # JDK locations from editor settings rather than from the environment.
      - name: Point Godot at the Android SDK
        run: |
          set -euo pipefail
          settings="$HOME/.config/godot/editor_settings-4.8.tres"
          mkdir -p "$(dirname "$settings")"
          cat > "$settings" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      # 4.8.dev4 refuses the export before gradle runs if any package in its own
      # list is absent, and a runner image carries whichever NDK it was built
      # with rather than this one. `sdkmanager` is a no-op for what is already
      # there, so the whole list is asked for rather than the one that moved.
      - name: Install the SDK packages the exporter insists on
        run: |
          set -euo pipefail
          # The image names the directory by the tools' own version, not always
          # `latest`, so the binary is found rather than assumed.
          sdkmanager=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          [ -n "$sdkmanager" ] || { echo "::error::no sdkmanager in the image"; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platform-tools" "build-tools;36.1.0" "platforms;android-36" \
            "ndk;29.0.14206865" "cmake;3.22.1"
          [ -d "$ANDROID_SDK_ROOT/ndk/29.0.14206865" ] || {
            echo "::error::the NDK the exporter checks for is still missing"; exit 1; }

      # `addons/android_native/bin/` is gitignored, so a checkout has no AAR and
      # the Android exporter answers a plugin with no binary the way the iOS one
      # does: it drops it and the build succeeds anyway. 0.1.0 shipped that way
      # and no handheld with a lower panel got one. Checked for after the export.
      - name: Build the Android plugins
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          tools/build_android_plugin.sh
          ls -l addons/android_native/bin/*.aar

      - name: Materialize the Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_B64 is not set. See DEVICES.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          export_one() {
            local preset="$1" out="$2"
            mkdir -p "$(dirname "$out")"
            GODOT_CAP=1200 tools/ci_godot.sh "$GODOT" --headless --path . \
              --export-release "$preset" "$out"
            [ -s "$out" ] || { echo "::error::$preset produced nothing at $out"; exit 1; }
          }
          export_one "Linux"                 "dist/pokerecomp-${v}-linux-x86_64"
          export_one "Linux ARM64"           "dist/pokerecomp-${v}-linux-arm64"
          export_one "Windows Desktop"       "dist/pokerecomp-${v}-windows-x86_64.exe"
          export_one "Windows Desktop ARM64" "dist/pokerecomp-${v}-windows-arm64.exe"
          # --install-android-build-template unpacks the gradle project the
          # preset builds through; it only acts alongside an export.
          mkdir -p dist
          GODOT_CAP=1800 tools/ci_godot.sh "$GODOT" --headless --path . \
            --install-android-build-template \
            --export-release "Android" "dist/pokerecomp-${v}-android.apk"
          [ -s "dist/pokerecomp-${v}-android.apk" ] || { echo "::error::no APK"; exit 1; }
          chmod +x "dist/pokerecomp-${v}-linux-x86_64" "dist/pokerecomp-${v}-linux-arm64"
          ls -lh dist

      - name: Refuse an APK with either Android plugin missing
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          apk="dist/pokerecomp-${v}-android.apk"
          dex=$(unzip -Z1 "$apk" '*.dex')
          # Counted rather than `grep -qa`, for the SIGPIPE reason above.
          for class in SecondScreen PlatformPower; do
            found=$(unzip -p "$apk" $dex | grep -ca "$class" || true)
            if [ "$found" -eq 0 ]; then
              echo "::error::the APK carries no $class; the AAR did not link"
              exit 1
            fi
            echo "$class ✓ ($found)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-windows-android
          path: dist/*

  apple:
    name: macos and ios
    needs: [version, templates]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_macos.universal.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          # The executable is signed as part of Godot.app. Copying it out of the
          # bundle invalidates that signature and Gatekeeper answers with
          # SIGKILL, so the bundle is kept whole and called through.
          sudo rm -rf /Applications/Godot.app
          sudo cp -R "/tmp/godot/Godot.app" /Applications/Godot.app
          sudo xattr -dr com.apple.quarantine /Applications/Godot.app
          echo "GODOT=/Applications/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -R /tmp/tpz/templates/. "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      # macOS is a whole template; iOS is one static library inside the stock
      # archive, because that template is an Xcode project around several
      # xcframeworks and the export only ever reaches for the release device
      # slice.
      - uses: actions/download-artifact@v8
        with:
          pattern: templates-{macos,ios}
          path: /tmp/templates
          merge-multiple: true
      - name: Overlay the project's own export templates
        run: |
          set -euo pipefail
          dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          before=$(du -sk "$dir" | cut -f1)
          cp -f /tmp/templates/macos.zip "$dir/macos.zip"
          slice=libgodot.ios.release.xcframework/ios-arm64
          mkdir -p "/tmp/ios/$slice"
          cp /tmp/templates/libgodot.ios.release.a "/tmp/ios/$slice/libgodot.a"
          # `zip` replaces a member that is already there.
          ( cd /tmp/ios && zip -q "$dir/ios.zip" "$slice/libgodot.a" )
          echo "template directory: ${before} kB -> $(du -sk "$dir" | cut -f1) kB"

      # iOS has no system file picker at this engine pin, so `ios/plugins` ships
      # one and every import on that platform goes through it. Its libraries are
      # gitignored, a checkout therefore has none, and the exporter answers a
      # plugin whose binary is missing by quietly dropping it: the build still
      # succeeds and ships the engine's own browser, which on iOS can only list
      # the app's own data. That is a release nobody can import a cartridge
      # with, so the plugin is built here and checked for after the export.
      - name: Build the iOS file picker plugin
        run: |
          set -euo pipefail
          # See export-templates.yml: the image's untrusted aws/tap makes
          # Homebrew warn on every install until it is dropped.
          brew untap aws/tap 2>/dev/null || true
          brew install scons
          # The plugin is linked into the templates `export-templates.yml`
          # builds, so a pin that has drifted from that one is two engines.
          grep -q "GODOT_COMMIT: $GODOT_COMMIT" .github/workflows/export-templates.yml \
            || { echo "::error::the plugin pin disagrees with the template pin"; exit 1; }
          git init -q .references/godot
          git -C .references/godot remote add origin https://github.com/godotengine/godot.git
          git -C .references/godot fetch -q --depth 1 origin "$GODOT_COMMIT"
          git -C .references/godot checkout -q FETCH_HEAD
          # Three headers the engine's own build generates and a plain checkout
          # does not have. Nothing else of the engine is built.
          ( cd .references/godot && scons platform=ios target=template_debug arch=arm64 \
              core/extension/gdextension_interface.gen.h \
              core/extension/ext_wrappers.gen.h \
              core/disabled_classes.gen.h )
          tools/build_ios_plugin.sh
          ls -l ios/plugins/*/*.a

      - name: Import
        run: |
          set -euo pipefail
          GODOT_CAP=900 tools/ci_godot.sh "$GODOT" --headless --editor --path . --quit
          [ -d .godot ] || { echo "::error::import produced no .godot"; exit 1; }

      # Ad-hoc signed, not notarized: no Apple account is involved and none can
      # be, because the certificate would name one. Gatekeeper asks the player
      # to confirm the first launch; the release notes say so.
      - name: Export macOS
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          GODOT_CAP=1200 tools/ci_godot.sh "$GODOT" --headless --path . \
            --export-release "macOS" "dist/pokerecomp-${v}-macos.zip"
          [ -s "dist/pokerecomp-${v}-macos.zip" ] || { echo "::error::no macOS zip"; exit 1; }

      # The published IPA is unsigned on purpose: AltStore and SideStore re-sign
      # it with the player's own Apple ID, and a signed one would carry a
      # provisioning profile naming the maintainer's developer account. Godot's
      # exporter refuses an empty team id even project-only, so a placeholder
      # goes in and nothing ever uses it.
      - name: Export iOS unsigned
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          sed -i '' 's/app_store_team_id=""/app_store_team_id="0000000000"/' export_presets.cfg
          mkdir -p build/ios
          GODOT_CAP=1200 tools/ci_godot.sh "$GODOT" --headless --path . \
            --export-release "iOS" build/ios/pokerecomp.ipa
          git checkout export_presets.cfg

          xcodebuild -project build/ios/pokerecomp.xcodeproj -scheme pokerecomp \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/pokerecomp.app"
          [ -d "$app" ] || { echo "::error::no built .app"; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/pokerecomp-${v}-ios.ipa" Payload)

      # 0.1.0 shipped without it and every player's only picker was a browser
      # of the app's own empty data. Nothing else can notice: the exporter drops
      # an invalid plugin silently, and the preset still says it is on.
      - name: Refuse an IPA with either iOS plugin missing
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          rm -rf "$RUNNER_TEMP/audit" && mkdir -p "$RUNNER_TEMP/audit"
          unzip -q "dist/pokerecomp-${v}-ios.ipa" -d "$RUNNER_TEMP/audit"
          binary="$RUNNER_TEMP/audit/Payload/pokerecomp.app/pokerecomp"
          # `grep -q` stops at the first match and the writer upstream then dies
          # of SIGPIPE, which `pipefail` reports as the whole pipeline failing.
          # A gate written that way refuses every build, including the ones that
          # are right. Count instead: `grep -c` reads to the end.
          for symbol in NativeFilePicker NativePower; do
            found=$(strings -a "$binary" | grep -c "$symbol" || true)
            if [ "$found" -eq 0 ]; then
              echo "::error::the IPA carries no $symbol; the plugin did not link"
              exit 1
            fi
            echo "$symbol ✓ ($found)"
          done

      # A signed IPA would be a private leak in a public download, so the gate
      # is here rather than in the release notes.
      - name: Refuse an IPA that carries an identity
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          if unzip -l "dist/pokerecomp-${v}-ios.ipa" \
              | grep -E 'mobileprovision|_CodeSignature'; then
            echo "::error::the IPA is signed; it must not be"
            exit 1
          fi
          echo "unsigned ✓"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-apple
          path: dist/*

  switch:
    name: switch
    needs: [version, templates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          echo "GODOT=/usr/local/bin/godot" >> "$GITHUB_ENV"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -R /tmp/tpz/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      - uses: actions/download-artifact@v8
        with:
          name: templates-switch
          path: /tmp/switch

      - name: Import
        run: |
          set -euo pipefail
          GODOT_CAP=900 tools/ci_godot.sh "$GODOT" --headless --editor --path . --quit
          [ -d .godot ] || { echo "::error::import produced no .godot"; exit 1; }

      # A stock editor knows no NX platform, so `export_presets.cfg` carries no
      # Switch preset and this exports the pack alone. Every preset here ships
      # the same file set, and a pack holds each feature-tagged setting rather
      # than one platform's answer, so the Linux preset's pack is the game.
      - name: Export the pack
        run: |
          set -euo pipefail
          mkdir -p romfs dist
          GODOT_CAP=900 tools/ci_godot.sh "$GODOT" --headless --path . \
            --export-pack "Linux" "$PWD/romfs/game.pck"
          [ -s romfs/game.pck ] || { echo "::error::the pack is empty"; exit 1; }

      # nacptool writes the title, author and version hbmenu shows; elf2nro
      # wraps the template around the pack as a RomFS image. Both are devkitPro
      # tools and the image is where they are packaged.
      - name: Wrap the template into an NRO
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          cp /tmp/switch/switch_release.elf switch_release.elf
          # An NRO icon is a 256x256 JPEG and nothing else; the repository's is
          # a PNG, so it is converted here rather than committed twice. Godot
          # does it because Godot is already installed in this job and is the
          # project's own tool: this step used to reach for whichever of
          # `magick` and `convert` the runner image carried, and the 0.1.6 build
          # failed when it carried neither.
          GODOT_CAP=300 tools/ci_godot.sh "$GODOT" --headless --path . \
            -s res://tools/make_nro_icon.gd -- "$PWD/app_icon.jpg"
          [ -s app_icon.jpg ] || { echo "::error::the NRO icon is empty"; exit 1; }
          docker run --rm -v "$PWD:/w" -w /w devkitpro/devkita64:latest bash -c "
            set -euo pipefail
            nacptool --create pokerecomp '${{ github.repository_owner }}' '$v' control.nacp
            elf2nro switch_release.elf pokerecomp.nro \
              --icon=app_icon.jpg --nacp=control.nacp --romfsdir=romfs
          "
          [ -s pokerecomp.nro ] || { echo "::error::elf2nro produced nothing"; exit 1; }

      # The zip extracts at the root of a microSD: hbmenu lists what is in
      # `switch/`, and Ryujinx and the yuzu forks read the same tree.
      - name: Stage the SD tree
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p sd/switch
          cp pokerecomp.nro sd/switch/pokerecomp.nro
          ( cd sd && zip -qr "../dist/pokerecomp-${v}-switch.zip" switch )
          unzip -l "dist/pokerecomp-${v}-switch.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-switch
          path: dist/*

  publish:
    name: publish
    needs: [version, linux-windows-android, apple, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: staged
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          cd staged
          chmod +x "pokerecomp-${v}-linux-x86_64" "pokerecomp-${v}-linux-arm64"
          sha256sum pokerecomp-* > sha256sums.txt
          cat sha256sums.txt
          cd ..

          notes="$(sed "s/{VERSION}/${v}/g" .github/release-notes.md)"
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "$v" --notes "$notes" staged/*

      - name: Announce on Discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          [ -n "${DISCORD_RELEASE_WEBHOOK:-}" ] \
            || { echo "::error::DISCORD_RELEASE_WEBHOOK is not set"; exit 1; }
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}"
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg content "$release_url" '{content: $content}')" \
            "$DISCORD_RELEASE_WEBHOOK"
